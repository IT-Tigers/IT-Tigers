<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>活動行程｜IT 洲際虎</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                "Noto Sans TC",
                "Microsoft JhengHei",
                Arial,
                sans-serif;
            background: #07130f;
            color: #ffffff;
            line-height: 1.6;
        }

        /* =========================
           NAV
        ========================= */

        nav {
            position: sticky;
            top: 0;
            z-index: 1000;

            background: rgba(7, 19, 15, 0.96);
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);

            backdrop-filter: blur(10px);
        }

        .nav-inner {
            max-width: 1200px;
            margin: auto;

            height: 72px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 24px;
        }

        .logo {
            color: #d4af37;
            text-decoration: none;

            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            transition: 0.25s;
        }

        .nav-links a:hover {
            color: #d4af37;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            background:
                radial-gradient(
                    circle at center,
                    rgba(26, 74, 53, 0.65),
                    transparent 60%
                );

            text-align: center;

            padding: 90px 20px 70px;
        }

        .hero-label {
            color: #d4af37;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 14px;
        }

        .hero h1 {
            font-size: clamp(42px, 8vw, 72px);
            font-weight: 900;
            letter-spacing: 4px;
            margin-bottom: 16px;
        }

        .hero p {
            color: #b9c5bf;
            font-size: 17px;
        }

        /* =========================
           CONTENT
        ========================= */

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 20px 20px 100px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 15px;

            margin-bottom: 30px;
        }

        .section-title::before {
            content: "";

            width: 5px;
            height: 32px;

            background: #d4af37;
            border-radius: 3px;
        }

        .section-title h2 {
            font-size: 28px;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;
            padding: 70px 20px;

            color: #aebbb4;
        }

        .loading-spinner {
            width: 38px;
            height: 38px;

            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #d4af37;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           EVENTS
        ========================= */

        .events {
            display: grid;
            gap: 18px;
        }

        .event-card {
            display: grid;

            grid-template-columns: 150px 1fr;

            background: #0d2119;

            border: 1px solid rgba(212, 175, 55, 0.16);

            border-radius: 14px;

            overflow: hidden;

            transition:
                transform 0.25s,
                border-color 0.25s,
                background 0.25s;
        }

        .event-card:hover {
            transform: translateY(-3px);

            border-color: rgba(212, 175, 55, 0.5);

            background: #10291f;
        }

        /* 日期 */

        .event-date {
            background: #10291f;

            border-right: 1px solid rgba(212, 175, 55, 0.12);

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .date-main {
            font-size: 27px;
            font-weight: 900;

            color: #d4af37;
        }

        .date-week {
            margin-top: 3px;

            font-size: 13px;

            color: #9aa9a1;
        }

        /* 內容 */

        .event-content {
            padding: 22px 25px;
        }

        .event-time {
            display: inline-block;

            color: #d4af37;

            font-size: 14px;
            font-weight: 700;

            margin-bottom: 5px;
        }

        .event-name {
            font-size: 22px;
            font-weight: 800;

            margin-bottom: 10px;
        }

        .event-info {
            display: flex;
            flex-wrap: wrap;

            gap: 15px;

            color: #aebbb4;

            font-size: 14px;
        }

        .event-location::before {
            content: "📍 ";
        }

        .event-note {
            margin-top: 12px;

            padding-top: 10px;

            border-top: 1px solid rgba(255,255,255,0.06);

            color: #899890;

            font-size: 13px;
        }

        /* =========================
           EMPTY / ERROR
        ========================= */

        .message-box {
            padding: 50px 20px;

            text-align: center;

            background: #0d2119;

            border-radius: 14px;

            border: 1px solid rgba(255,255,255,0.08);

            color: #9eaaa4;
        }

        .message-box strong {
            display: block;

            color: #ffffff;

            font-size: 20px;

            margin-bottom: 8px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            border-top: 1px solid rgba(255,255,255,0.08);

            text-align: center;

            padding: 35px 20px;

            color: #68766f;

            font-size: 13px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .nav-inner {
                height: 64px;
                padding: 0 18px;
            }

            .nav-links {
                gap: 14px;
            }

            .nav-links a {
                font-size: 13px;
            }

            .hero {
                padding: 65px 20px 50px;
            }

            .hero h1 {
                letter-spacing: 2px;
            }

            .container {
                padding: 10px 15px 70px;
            }

            .event-card {
                grid-template-columns: 1fr;
            }

            .event-date {
                flex-direction: row;

                justify-content: flex-start;

                gap: 10px;

                padding: 14px 18px;

                border-right: none;

                border-bottom: 1px solid rgba(212, 175, 55, 0.12);
            }

            .date-main {
                font-size: 22px;
            }

            .event-content {
                padding: 18px;
            }

            .event-name {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAV
    ========================= -->

    <nav>
        <div class="nav-inner">

            <a href="index.html" class="logo">
                IT 洲際虎
            </a>

            <div class="nav-links">
                <a href="index.html">首頁</a>
                <a href="events.html">活動行程</a>
            </div>

        </div>
    </nav>


    <!-- =========================
         HERO
    ========================= -->

    <section class="hero">

        <div class="hero-label">
            IT TIGERS
        </div>

        <h1>活動行程</h1>

        <p>
            每一場訓練、每一場比賽，都是我們前進的一步。
        </p>

    </section>


    <!-- =========================
         EVENTS
    ========================= -->

    <main class="container">

        <div class="section-title">
            <h2>近期活動</h2>
        </div>

        <div id="events" class="events">

            <div class="loading">
                <div class="loading-spinner"></div>
                正在載入活動行程...
            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================= -->

    <footer>
        © 2026 IT 洲際虎｜IT Tigers
    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>

        /*
         * Google Sheets CSV
         */

        const CSV_URL =
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vRL0a83NeFlruconqhLBBfrnq8SwnVUAZ0pMDoRcaPTlUK5Sommhpq82NgP9n5a1RLdMi7zvdjfdrK0/pub?gid=0&single=true&output=csv";


        /*
         * CSV 解析
         */

        function parseCSV(text) {

            const rows = [];

            let row = [];
            let value = "";
            let insideQuotes = false;

            for (let i = 0; i < text.length; i++) {

                const char = text[i];
                const next = text[i + 1];

                if (char === '"' && insideQuotes && next === '"') {

                    value += '"';

                    i++;

                } else if (char === '"') {

                    insideQuotes = !insideQuotes;

                } else if (char === "," && !insideQuotes) {

                    row.push(value.trim());

                    value = "";

                } else if (
                    (char === "\n" || char === "\r")
                    && !insideQuotes
                ) {

                    if (value !== "" || row.length > 0) {

                        row.push(value.trim());

                        rows.push(row);

                        row = [];
                        value = "";
                    }

                } else {

                    value += char;
                }
            }

            if (value !== "" || row.length > 0) {

                row.push(value.trim());

                rows.push(row);
            }

            return rows;
        }


        /*
         * HTML 防注入
         */

        function escapeHTML(value) {

            return String(value || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /*
         * 日期格式
         */

        function formatDate(dateText) {

            if (!dateText) {
                return {
                    main: "",
                    week: ""
                };
            }

            const date = new Date(dateText);

            if (isNaN(date.getTime())) {

                return {
                    main: dateText,
                    week: ""
                };
            }

            const month = date.getMonth() + 1;
            const day = date.getDate();

            const weekdays = [
                "週日",
                "週一",
                "週二",
                "週三",
                "週四",
                "週五",
                "週六"
            ];

            return {
                main: `${month}/${day}`,
                week: weekdays[date.getDay()]
            };
        }


        /*
         * 載入活動
         */

        async function loadEvents() {

            const container =
                document.getElementById("events");

            try {

                const response =
                    await fetch(CSV_URL);

                if (!response.ok) {

                    throw new Error(
                        "Google Sheets CSV 讀取失敗"
                    );
                }

                const text =
                    await response.text();

                const rows =
                    parseCSV(text);


                if (rows.length < 2) {

                    container.innerHTML = `
                        <div class="message-box">
                            <strong>目前沒有活動行程</strong>
                            請稍後再查看。
                        </div>
                    `;

                    return;
                }


                /*
                 * 第一列 = 欄位名稱
                 */

                const headers =
                    rows[0].map(
                        h => h.trim()
                    );


                /*
                 * 將資料轉成物件
                 */

                const events =
                    rows
                        .slice(1)
                        .filter(row =>
                            row.some(
                                cell =>
                                    cell.trim() !== ""
                            )
                        )
                        .map(row => {

                            const event = {};

                            headers.forEach(
                                (header, index) => {

                                    event[header] =
                                        row[index] || "";

                                }
                            );

                            return event;
                        });


                /*
                 * 依日期排序
                 */

                events.sort(
                    (a, b) => {

                        const dateA =
                            new Date(a["日期"]);

                        const dateB =
                            new Date(b["日期"]);

                        return dateA - dateB;
                    }
                );


                /*
                 * 建立畫面
                 */

                container.innerHTML = "";


                events.forEach(event => {

                    const date =
                        formatDate(
                            event["日期"]
                        );

                    const time =
                        event["時間"] || "";

                    const name =
                        event["活動名稱"] ||
                        "未命名活動";

                    const location =
                        event["地點"] || "";

                    const note =
                        event["備註"] || "";


                    const card =
                        document.createElement("article");

                    card.className =
                        "event-card";


                    card.innerHTML = `

                        <div class="event-date">

                            <div class="date-main">
                                ${escapeHTML(date.main)}
                            </div>

                            <div class="date-week">
                                ${escapeHTML(date.week)}
                            </div>

                        </div>


                        <div class="event-content">

                            ${
                                time
                                ? `
                                    <div class="event-time">
                                        ${escapeHTML(time)}
                                    </div>
                                  `
                                : ""
                            }

                            <div class="event-name">
                                ${escapeHTML(name)}
                            </div>


                            <div class="event-info">

                                ${
                                    location
                                    ? `
                                        <div class="event-location">
                                            ${escapeHTML(location)}
                                        </div>
                                      `
                                    : ""
                                }

                            </div>


                            ${
                                note
                                ? `
                                    <div class="event-note">
                                        ${escapeHTML(note)}
                                    </div>
                                  `
                                : ""
                            }

                        </div>
                    `;


                    container.appendChild(card);

                });


                /*
                 * 沒有有效資料
                 */

                if (events.length === 0) {

                    container.innerHTML = `
                        <div class="message-box">
                            <strong>目前沒有活動行程</strong>
                            請稍後再查看。
                        </div>
                    `;
                }

            } catch (error) {

                console.error(error);

                container.innerHTML = `

                    <div class="message-box">

                        <strong>
                            活動行程載入失敗
                        </strong>

                        請確認 Google Sheets
                        已經發布到網路。

                    </div>

                `;
            }
        }


        /*
         * 開始載入
         */

        loadEvents();

    </script>

</body>
</html>
