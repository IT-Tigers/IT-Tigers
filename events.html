<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活動行程｜IT 洲際虎</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;background:#f4f6f8;color:#172033;line-height:1.6}
a{text-decoration:none;color:inherit}
nav{position:fixed;top:0;left:0;width:100%;height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 50px;background:rgba(7,26,51,.97);border-bottom:1px solid rgba(244,196,0,.25);z-index:1000;backdrop-filter:blur(10px)}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;letter-spacing:1px;white-space:nowrap}
.logo img{width:60px;height:60px;object-fit:contain}
.logo span{font-size:20px}
.nav-links{display:flex;align-items:center;gap:28px}
.nav-links a{color:#fff;font-size:14px;font-weight:700;transition:.2s}
.nav-links a:hover,.nav-links a.active{color:#f4c400}
.menu-btn{display:none;background:none;border:0;color:#fff;font-size:28px;cursor:pointer}
.hero{margin-top:72px;background:linear-gradient(135deg,#071a33 0%,#0b3a82 65%,#1565c0 100%);color:#fff;text-align:center;padding:72px 20px 64px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(244,196,0,.10);right:-80px;top:-100px}
.hero-label{color:#f4c400;font-size:13px;font-weight:900;letter-spacing:4px;margin-bottom:10px}
.hero h1{font-size:clamp(38px,7vw,64px);font-weight:900;letter-spacing:3px;margin-bottom:12px}
.hero p{color:rgba(255,255,255,.82);font-size:16px}
.container{max-width:1100px;margin:auto;padding:58px 20px 100px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}
.section-title .en{display:block;color:#1565c0;font-size:12px;font-weight:900;letter-spacing:3px;margin-bottom:4px}
.section-title h2{font-size:30px;color:#172033}
.section-desc{color:#687386;font-size:14px}
.events{display:grid;gap:16px}
.event-card{display:grid;grid-template-columns:150px 1fr;background:#fff;border:1px solid #dde3e8;border-radius:12px;overflow:hidden;box-shadow:0 4px 14px rgba(7,26,51,.05);transition:.22s}
.event-card:hover{transform:translateY(-3px);border-color:rgba(21,101,192,.35);box-shadow:0 9px 24px rgba(7,26,51,.10)}
.event-date{background:#071a33;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:22px;border-right:4px solid #f4c400}
.date-main{font-size:29px;font-weight:900;line-height:1.2}
.date-week{margin-top:4px;font-size:13px;color:#d5dfeb}
.event-content{padding:21px 25px}
.event-time{display:inline-block;color:#1565c0;font-size:13px;font-weight:900;margin-bottom:4px}
.event-name{font-size:21px;font-weight:900;color:#172033;margin-bottom:9px}
.event-info{display:flex;flex-wrap:wrap;gap:14px;color:#687386;font-size:14px}
.event-location:before{content:"📍 "}
.event-note{margin-top:12px;padding-top:10px;border-top:1px solid #edf0f3;color:#7a8494;font-size:13px}
.loading,.message-box{grid-column:1/-1;text-align:center;padding:55px 20px;border-radius:12px}
.loading{color:#687386}
.loading-spinner{width:36px;height:36px;border:3px solid #e1e6eb;border-top-color:#1565c0;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.message-box{background:#fff;border:1px solid #dde3e8;color:#687386}
.message-box strong{display:block;color:#172033;font-size:19px;margin-bottom:6px}
.message-box.error{background:rgba(244,196,0,.08);border-color:rgba(244,196,0,.45)}
.back-home{display:inline-flex;align-items:center;gap:7px;margin-top:32px;padding:11px 18px;background:#0b3a82;color:#fff;border-radius:6px;font-size:14px;font-weight:800;transition:.2s}
.back-home:hover{background:#1565c0}
footer{background:#071a33;color:#9eabc0;text-align:center;padding:32px 20px;font-size:13px}
@media(max-width:700px){
nav{height:64px;padding:0 18px}
.logo img{width:50px;height:50px}
.logo span{font-size:17px}
.menu-btn{display:block}
.nav-links{display:none;position:absolute;top:64px;left:0;width:100%;padding:12px 18px 18px;background:#071a33;border-bottom:1px solid rgba(244,196,0,.2);flex-direction:column;align-items:stretch;gap:0}
.nav-links.open{display:flex}
.nav-links a{padding:11px 4px}
.hero{margin-top:64px;padding:58px 20px 48px}
.hero h1{letter-spacing:1px}
.container{padding:42px 15px 70px}
.section-head{display:block;margin-bottom:22px}
.section-desc{margin-top:6px}
.event-card{grid-template-columns:1fr}
.event-date{flex-direction:row;justify-content:flex-start;gap:10px;padding:14px 18px;border-right:0;border-bottom:4px solid #f4c400}
.date-main{font-size:22px}
.event-content{padding:18px}
.event-name{font-size:19px}
}
</style>
</head>
<body>
<nav>
<div class="logo">
<a href="index.html"><img src="logo.png" alt="IT 洲際虎 Logo"></a>
<a href="index.html"><span>IT 洲際虎</span></a>
</div>
<button class="menu-btn" id="menuBtn" aria-label="開啟選單">☰</button>
<div class="nav-links" id="navLinks">
<a href="index.html">首頁</a>
<a href="index.html#about">關於我們</a>
<a href="index.html#training">訓練資訊</a>
<a href="index.html#teams">招生班別</a>
<a href="events.html" class="active">活動行程</a>
<a href="index.html#coaches">教練團隊</a>
<a href="index.html#join">聯絡我們</a>
</div>
</nav>

<section class="hero">
<div class="hero-label">IT TIGERS</div>
<h1>活動行程</h1>
<p>每一場訓練、每一場比賽，都是我們一起前進的一步。</p>
</section>

<main class="container">
<div class="section-head">
<div class="section-title">
<span class="en">EVENT SCHEDULE</span>
<h2>近期活動</h2>
</div>
<div class="section-desc">最新活動將由球隊資料表自動更新</div>
</div>
<div id="events" class="events">
<div class="loading"><div class="loading-spinner"></div>正在載入活動行程…</div>
</div>
<a class="back-home" href="index.html">← 回到首頁</a>
</main>

<footer>© 2026 IT 洲際虎｜IT Tigers</footer>

<script>
const CSV_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vRL0a83NeFlruconqhLBBfrnq8SwnVUAZ0pMDoRcaPTlUK5Sommhpq82NgP9n5a1RLdMi7zvdjfdrK0/pub?gid=0&single=true&output=csv";

function parseCSV(text){
const rows=[];let row=[],value="",insideQuotes=false;
for(let i=0;i<text.length;i++){
const char=text[i],next=text[i+1];
if(char==='"'&&insideQuotes&&next==='"'){value+='"';i++}
else if(char==='"')insideQuotes=!insideQuotes;
else if(char===','&&!insideQuotes){row.push(value.trim());value=""}
else if((char==="\n"||char==="\r")&&!insideQuotes){
if(value!==""||row.length>0){row.push(value.trim());rows.push(row);row=[];value=""}
}else value+=char;
}
if(value!==""||row.length>0){row.push(value.trim());rows.push(row)}
return rows;
}
function escapeHTML(value){
return String(value||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function parseDate(dateText){
if(!dateText)return null;
const date=new Date(dateText);
return isNaN(date.getTime())?null:date;
}
function formatDate(dateText){
const date=parseDate(dateText);
if(!date)return{main:dateText||"",week:""};
const weekdays=["週日","週一","週二","週三","週四","週五","週六"];
return{main:(date.getMonth()+1)+"/"+date.getDate(),week:weekdays[date.getDay()]};
}
async function loadEvents(){
const container=document.getElementById("events");
try{
const response=await fetch(CSV_URL,{cache:"no-store"});
if(!response.ok)throw new Error("Google Sheets CSV 讀取失敗");
const rows=parseCSV(await response.text());
if(rows.length<2){showEmpty(container);return}
const headers=rows[0].map(h=>h.trim());
const required=["日期","時間","活動名稱","地點","備註"];
const valid=required.every(h=>headers.includes(h));
if(!valid)throw new Error("Google Sheets 欄位名稱不符合設定");
const events=rows.slice(1).filter(row=>row.some(cell=>cell.trim()!=="")).map(row=>{
const event={};headers.forEach((header,index)=>event[header]=row[index]||"");return event;
});
events.sort((a,b)=>{
const da=parseDate(a["日期"]),db=parseDate(b["日期"]);
if(da&&db)return da-db;
return String(a["日期"]||"").localeCompare(String(b["日期"]||""));
});
container.innerHTML="";
events.forEach(event=>{
const date=formatDate(event["日期"]);
const time=event["時間"]||"";
const name=event["活動名稱"]||"未命名活動";
const location=event["地點"]||"";
const note=event["備註"]||"";
const card=document.createElement("article");
card.className="event-card";
card.innerHTML=`
<div class="event-date">
<div class="date-main">${escapeHTML(date.main)}</div>
<div class="date-week">${escapeHTML(date.week)}</div>
</div>
<div class="event-content">
${time?`<div class="event-time">${escapeHTML(time)}</div>`:""}
<div class="event-name">${escapeHTML(name)}</div>
<div class="event-info">
${location?`<div class="event-location">${escapeHTML(location)}</div>`:""}
</div>
${note?`<div class="event-note">${escapeHTML(note)}</div>`:""}
</div>`;
container.appendChild(card);
});
if(events.length===0)showEmpty(container);
}catch(error){
console.error(error);
container.innerHTML=`<div class="message-box error"><strong>活動行程載入失敗</strong>請確認 Google Sheets 已經發布到網路，或稍後再試。</div>`;
}
}
function showEmpty(container){
container.innerHTML='<div class="message-box"><strong>目前沒有活動行程</strong>請稍後再查看。</div>';
}
document.getElementById("menuBtn").addEventListener("click",()=>{
document.getElementById("navLinks").classList.toggle("open");
});
document.querySelectorAll(".nav-links a").forEach(link=>{
link.addEventListener("click",()=>document.getElementById("navLinks").classList.remove("open"));
});
loadEvents();
</script>
</body>
</html>
